# Just the databases, for local development with `npm run dev`.
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_dev_data:/data/db

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  mongo_dev_data:
